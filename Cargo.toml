[package]
name = "inference-router"
version = "0.1.0"
edition = "2021"
description = "Prefix-aware request router for LLM inference replica fleets"
license = "MIT"
# No `rust-version` is declared, deliberately.
#
# An earlier revision declared 1.85 (MeluXina's only Rust module; `module -t
# avail Rust` in job 5211438 lists no other) and relied on `resolver = "3"`, the
# MSRV-aware resolver, to pick dependency versions that still build on it. That
# could not be made airtight: the resolver can only honour the `rust-version`
# each UPSTREAM crate declares. `yoke-derive`, reached via
# reqwest -> url -> idna -> icu_*, needs a newer compiler without declaring it,
# so build 5214119 failed with error[E0599] (`str::from_utf8` as an inherent
# associated function). Pinning our own floor only protects against
# well-behaved dependencies, and the failure just moves to whichever transitive
# crate is least careful.
#
# A declared floor this crate does not actually build on is worse than none, so
# the claim is removed. The toolchain is now rustup-managed stable, installed by
# slurm/build.sh, and the exact compiler used is recorded per build in
# `toolchain.lock`.
resolver = "3"

[[bin]]
name = "inference-router"
path = "src/main.rs"

[lib]
name = "inference_router"
path = "src/lib.rs"

[dependencies]
axum = { version = "0.7", features = ["http1", "json", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "net"] }
tokio-stream = "0.1"
tower = "0.5"
hyper = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
futures-util = "0.3"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2"
anyhow = "1"
parking_lot = "0.12"
http = "1"
# OpenTelemetry tracing (off unless --otlp-endpoint is set; see src/telemetry.rs).
# These four move in lockstep: tracing-opentelemetry 0.32 targets opentelemetry 0.31.
opentelemetry = "0.31"
opentelemetry_sdk = "0.31"
opentelemetry-otlp = { version = "0.31", default-features = false, features = ["trace", "http-proto", "reqwest-blocking-client"] }
opentelemetry-http = "0.31"
tracing-opentelemetry = "0.32"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
axum = { version = "0.7", features = ["http1", "json", "tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
