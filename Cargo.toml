[package]
name = "inference-router"
version = "0.1.0"
edition = "2021"
# MeluXina's EasyBuild tree carries exactly one Rust: `Rust/1.85.1-GCCcore-14.2.0`
# (`module -t avail Rust` in job 5211438 lists no other). Several crates in
# reqwest's transitive `url` -> `idna` -> `icu_*` chain have since raised their
# MSRV to 1.88, so a default resolve picks versions that cannot compile here.
#
# `resolver = "3"` is cargo's MSRV-aware resolver: it treats `rust-version`
# below as a constraint and selects the newest dependency versions that still
# support it, instead of the newest that exist. That is far more robust than
# hand-pinning a dozen `icu_*` crates with `--precise`, which would need
# redoing every time the chain moves.
rust-version = "1.85"
resolver = "3"
description = "Prefix-aware request router for LLM inference replica fleets"
license = "MIT"

[[bin]]
name = "inference-router"
path = "src/main.rs"

[lib]
name = "inference_router"
path = "src/lib.rs"

[dependencies]
axum = { version = "0.7", features = ["http1", "json", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "net"] }
tokio-stream = "0.1"
tower = "0.5"
hyper = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
futures-util = "0.3"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2"
anyhow = "1"
parking_lot = "0.12"
http = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
axum = { version = "0.7", features = ["http1", "json", "tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
