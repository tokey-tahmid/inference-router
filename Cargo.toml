[package]
name = "inference-router"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Prefix-aware request router for LLM inference replica fleets"
license = "MIT"

[[bin]]
name = "inference-router"
path = "src/main.rs"

[lib]
name = "inference_router"
path = "src/lib.rs"

[dependencies]
axum = { version = "0.7", features = ["http1", "json", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "net"] }
tokio-stream = "0.1"
tower = "0.5"
hyper = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "http1"] }
futures-util = "0.3"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2"
anyhow = "1"
parking_lot = "0.12"
http = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
axum = { version = "0.7", features = ["http1", "json", "tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "http1"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
